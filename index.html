<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zombie Defence</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud">
      <div id="hud-clock" class="panel"></div>
      <div id="hud-countdown" hidden></div>
      <div id="hud-request" class="panel" hidden></div>
      <div id="hud-report" class="panel" hidden></div>
      <div id="hud-district" class="panel"></div>
      <div id="hud-flight" class="panel"></div>
      <div id="hud-cargo" class="panel"></div>
      <div id="hud-ops" class="panel" hidden></div>
      <ul id="hud-radio"></ul>
      <div id="hud-toast"></div>
      <div id="hud-help" class="panel"></div>
      <pre id="hud-pad" class="panel" hidden></pre>
    </div>

    <canvas id="map" hidden></canvas>
    <div id="command" hidden></div>

    <div id="campaign-end" hidden></div>

    <div id="pause" hidden>
      <div class="pause-card">
        <h1>Paused</h1>
        <p>Press <kbd>Esc</kbd> or <kbd>Menu</kbd> to resume.</p>
        <div id="pause-controls"></div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
